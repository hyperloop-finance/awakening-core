openapi: 3.1.0
info:
  title: Awakening API
  version: v1
  description: Mock-first API for BTC and tokenized-security collateral with fixed-rate borrowing and lending.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/markets:
    get:
      operationId: listMarkets
      responses:
        '200':
          description: Market catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketsResponse' }
  /api/v1/markets/{marketId}:
    parameters:
      - $ref: '#/components/parameters/MarketId'
    get:
      operationId: getMarket
      responses:
        '200':
          description: Market detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketDetail' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/markets/{marketId}/quote:
    parameters:
      - $ref: '#/components/parameters/MarketId'
      - name: side
        in: query
        required: true
        schema: { type: string, enum: [BORROW, LEND] }
      - name: amount
        in: query
        required: true
        schema: { $ref: '#/components/schemas/PlainDecimal' }
    get:
      operationId: getQuote
      responses:
        '200':
          description: Deterministic quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/portfolio/{wallet}:
    parameters:
      - $ref: '#/components/parameters/Wallet'
    get:
      operationId: getPortfolio
      responses:
        '200':
          description: Wallet portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/positions/{wallet}:
    parameters:
      - $ref: '#/components/parameters/Wallet'
    get:
      operationId: getPositions
      responses:
        '200':
          description: Protected borrow and lend positions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionPayload' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/orders:
    get:
      operationId: listOrders
      parameters:
        - name: wallet
          in: query
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        - name: side
          in: query
          schema: { type: string, enum: [BORROW, LEND] }
      responses:
        '200':
          description: Preview orders owned by the wallet
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Preview order created in memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/orders/{orderId}:
    delete:
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: wallet
          in: query
          required: true
          schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
      responses:
        '200':
          description: Cancelled preview order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/settlements/{wallet}:
    parameters:
      - $ref: '#/components/parameters/Wallet'
    get:
      operationId: listSettlements
      responses:
        '200':
          description: User settlement preview states
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SettlementItem' } }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/settlements/{positionId}/actions:
    post:
      operationId: simulateSettlementAction
      parameters:
        - name: positionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementActionRequest' }
      responses:
        '200':
          description: Updated simulation state; no chain transaction is sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementItem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/offers:
    post:
      operationId: createOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedOffer' }
      responses:
        '201':
          description: Offer stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/config:
    get:
      operationId: getRuntimeConfig
      responses:
        '200':
          description: Non-secret runtime configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfig' }
components:
  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema: { type: string, pattern: '^0x[a-f0-9]{64}$' }
    Wallet:
      name: wallet
      in: path
      required: true
      schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MarketMeta:
      type: object
      required: [profile, chainId, generatedAt, dataSource]
      properties:
        profile: { type: string }
        chainId: { type: integer }
        generatedAt: { type: string, format: date-time }
        dataSource:
          type: string
          enum: [MOCK_CATALOG, UNAVAILABLE]
          description: MOCK_CATALOG is deterministic fixture data, never indexed on-chain state.
    MarketsResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MarketSummary' } }
        meta: { $ref: '#/components/schemas/MarketMeta' }
    MarketSummary:
      type: object
      required: [id, collateralAsset, principalAsset, maturity, fixedApr, utilization, availableLiquidity, offerDepth, settlementState, contractsReady]
      properties:
        id: { type: string }
        collateralAsset: { type: string, example: NVDAB, description: BTC or a tokenized-security ticker in the deterministic preview catalog. }
        principalAsset: { type: string, example: USDC, description: Settlement asset; the preview catalog includes USDC and USDT. }
        maturity: { type: string, format: date-time }
        fixedApr: { type: string }
        utilization: { type: string }
        availableLiquidity: { type: string }
        offerDepth: { type: string }
        settlementState: { type: string, enum: [OPEN, MATURED, SETTLED] }
        contractsReady: { type: boolean }
    MarketDetail:
      allOf:
        - $ref: '#/components/schemas/MarketSummary'
        - type: object
          required: [collateralRatio, patCoverage, strike, patStatus, patSource, borrowLevels, lendLevels, minimumAmount]
          properties:
            collateralRatio: { type: string }
            patCoverage: { type: string }
            strike: { type: string }
            patStatus: { type: string, enum: [VERIFIED_PREVIEW] }
            patSource: { type: string, enum: [ATTESTED_CUSTODIAN_PREVIEW] }
            borrowLevels: { type: array, items: { $ref: '#/components/schemas/OrderBookLevel' } }
            lendLevels: { type: array, items: { $ref: '#/components/schemas/OrderBookLevel' } }
            minimumAmount: { type: string }
    OrderBookLevel:
      type: object
      required: [apr, availableAmount]
      properties:
        apr: { $ref: '#/components/schemas/PlainDecimal' }
        availableAmount: { $ref: '#/components/schemas/PlainDecimal' }
    CreateOrderRequest:
      type: object
      required: [wallet, marketId, side, amount, apr, expiry]
      properties:
        wallet: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        marketId: { type: string }
        side: { type: string, enum: [BORROW, LEND] }
        amount: { $ref: '#/components/schemas/PlainDecimal' }
        apr: { $ref: '#/components/schemas/PlainDecimal' }
        expiry: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/CreateOrderRequest'
        - type: object
          required: [id, filledAmount, remainingAmount, status, createdAt]
          properties:
            id: { type: string }
            filledAmount: { $ref: '#/components/schemas/PlainDecimal' }
            remainingAmount: { $ref: '#/components/schemas/PlainDecimal' }
            status: { type: string, enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, EXPIRED] }
            createdAt: { type: string, format: date-time }
    PositionPayload:
      type: object
      required: [wallet, totals, borrowPositions, lendPositions, profile, asOf, source]
      properties:
        wallet: { type: string }
        totals: { $ref: '#/components/schemas/PositionTotals' }
        borrowPositions: { type: array, items: { $ref: '#/components/schemas/PositionSummary' } }
        lendPositions: { type: array, items: { $ref: '#/components/schemas/PositionSummary' } }
        profile: { type: string }
        asOf: { type: string, format: date-time }
        source: { type: string, enum: [MOCK_CATALOG] }
    PositionTotals:
      type: object
      required: [borrowedPrincipal, lentPrincipal, collateralLocked, creditFaceValue, debtOutstanding]
      properties:
        borrowedPrincipal: { $ref: '#/components/schemas/PlainDecimal' }
        lentPrincipal: { $ref: '#/components/schemas/PlainDecimal' }
        collateralLocked: { $ref: '#/components/schemas/PlainDecimal' }
        creditFaceValue: { $ref: '#/components/schemas/PlainDecimal' }
        debtOutstanding: { $ref: '#/components/schemas/PlainDecimal' }
    PositionSummary:
      type: object
      required: [id, marketId, side, principal, collateral, creditUnits, debtUnits, faceValue, fixedApr, strike, patStatus, patCoverage, maturity, settlementState]
      properties:
        id: { type: string }
        marketId: { type: string }
        side: { type: string, enum: [BORROW, LEND] }
        principal: { $ref: '#/components/schemas/PlainDecimal' }
        collateral: { $ref: '#/components/schemas/PlainDecimal' }
        creditUnits: { $ref: '#/components/schemas/PlainDecimal' }
        debtUnits: { $ref: '#/components/schemas/PlainDecimal' }
        faceValue: { $ref: '#/components/schemas/PlainDecimal' }
        fixedApr: { $ref: '#/components/schemas/PlainDecimal' }
        strike: { $ref: '#/components/schemas/PlainDecimal' }
        patStatus: { type: string }
        patCoverage: { $ref: '#/components/schemas/PlainDecimal' }
        maturity: { type: string, format: date-time }
        settlementState: { type: string, enum: [OPEN, MATURED, SETTLED] }
    SettlementActionRequest:
      type: object
      required: [wallet, action]
      properties:
        wallet: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        action: { $ref: '#/components/schemas/SettlementAction' }
    SettlementAction:
      type: string
      enum: [SIMULATE_REPAY_DEBT, SIMULATE_RECOVER_COLLATERAL, SIMULATE_CLAIM_LENDER_PAYOUT, SIMULATE_CLAIM_RESIDUAL_PROCEEDS]
    SettlementItem:
      type: object
      required: [positionId, marketId, side, maturity, phase, outstandingDebt, recoverableCollateral, claimablePayout, claimableResidual, patStatus, availableActions, simulated]
      properties:
        positionId: { type: string }
        marketId: { type: string }
        side: { type: string, enum: [BORROW, LEND] }
        maturity: { type: string, format: date-time }
        phase: { type: string, enum: [PRE_MATURITY, REPAYMENT_AVAILABLE, READY_TO_CLAIM, FINALIZED] }
        outstandingDebt: { $ref: '#/components/schemas/PlainDecimal' }
        recoverableCollateral: { $ref: '#/components/schemas/PlainDecimal' }
        claimablePayout: { $ref: '#/components/schemas/PlainDecimal' }
        claimableResidual: { $ref: '#/components/schemas/PlainDecimal' }
        patStatus: { type: string }
        availableActions: { type: array, items: { $ref: '#/components/schemas/SettlementAction' } }
        simulated: { type: boolean }
    Quote:
      type: object
      required: [marketId, side, principal, collateralRequirement, interest, protocolFee, totalDueOrPayout, apr, maturity, expiresAt, executionSteps]
      properties:
        marketId: { type: string }
        side: { type: string, enum: [BORROW, LEND] }
        principal: { type: string }
        collateralRequirement: { type: string }
        interest: { type: string }
        protocolFee: { type: string }
        totalDueOrPayout: { type: string }
        apr: { type: string }
        maturity: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        executionSteps: { type: array, items: { type: string } }
    Portfolio:
      type: object
      required: [wallet, totals, borrowPositions, lendPositions, meta]
      properties:
        wallet: { type: string }
        totals: { $ref: '#/components/schemas/PortfolioTotals' }
        borrowPositions: { type: array, items: { $ref: '#/components/schemas/Position' } }
        lendPositions: { type: array, items: { $ref: '#/components/schemas/Position' } }
        meta: { $ref: '#/components/schemas/PortfolioMeta' }
    PortfolioMeta:
      type: object
      required: [profile, generatedAt, dataSource]
      properties:
        profile: { type: string }
        generatedAt: { type: string, format: date-time }
        dataSource:
          type: string
          enum: [MOCK_CATALOG]
          description: Deterministic fixture data; it is never indexed on-chain state.
    PortfolioTotals:
      type: object
      required: [borrowedPrincipal, lentPrincipal, collateralLocked]
      properties:
        borrowedPrincipal: { type: string }
        lentPrincipal: { type: string }
        collateralLocked: { type: string }
    Position:
      type: object
      required: [id, marketId, side, principal, collateral, maturity, settlementState]
      properties:
        id: { type: string }
        marketId: { type: string }
        side: { type: string, enum: [BORROW, LEND] }
        principal: { type: string }
        collateral: { type: string }
        maturity: { type: string, format: date-time }
        settlementState: { type: string, enum: [OPEN, MATURED, SETTLED] }
    SignedOffer:
      type: object
      description: |-
        While contractsReady is false, only EIP191_MOCK is accepted. Sign the UTF-8 payload below
        with EIP-191 personal_sign. Lines are joined by exactly one LF byte (0x0A), with no trailing LF:
        Awakening Mock Offer
        chainId:<configured chainId>
        wallet:<lowercase wallet>
        marketId:<lowercase marketId>
        amount:<BigDecimal.stripTrailingZeros().toPlainString()>
        apr:<BigDecimal.stripTrailingZeros().toPlainString()>
        expiry:<Instant.toString() UTC Z form>
        EIP-712 is not accepted without a deployed verifier; its future domain is
        {name: Awakening, version: '1', chainId, verifyingContract} and its Offer message is
        {wallet, marketId, amount, apr, expiry}.
      required: [signingScheme, wallet, marketId, amount, apr, expiry, signature]
      properties:
        signingScheme: { type: string, enum: [EIP191_MOCK] }
        wallet: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        marketId: { type: string, pattern: '^0x[a-f0-9]{64}$' }
        amount: { $ref: '#/components/schemas/PlainDecimal' }
        apr: { $ref: '#/components/schemas/PlainDecimal' }
        expiry: { type: string, format: date-time }
        signature: { type: string, pattern: '^0x[a-fA-F0-9]{130}$' }
    Offer:
      allOf:
        - $ref: '#/components/schemas/SignedOffer'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string }
            status: { type: string, enum: [OPEN] }
            createdAt: { type: string, format: date-time }
    RuntimeConfig:
      type: object
      required: [profile, chainId, rpcUrlConfigured, contractsReady]
      properties:
        profile: { type: string }
        chainId: { type: integer }
        rpcUrlConfigured: { type: boolean }
        contractsReady: { type: boolean }
        awakeningAddress: { type: [string, 'null'], pattern: '^0x[a-fA-F0-9]{40}$', description: Missing, malformed, or zero address is normalized to null; a string is non-zero. }
        settlementAddress: { type: [string, 'null'], pattern: '^0x[a-fA-F0-9]{40}$', description: Missing, malformed, or zero address is normalized to null; a string is non-zero. }
        patAddress: { type: [string, 'null'], pattern: '^0x[a-fA-F0-9]{40}$', description: Missing, malformed, or zero address is normalized to null; a string is non-zero. }
        optionVaultAddress: { type: [string, 'null'], pattern: '^0x[a-fA-F0-9]{40}$', description: Missing, malformed, or zero address is normalized to null; a string is non-zero. }
    PlainDecimal:
      type: string
      pattern: '^\\d+(\\.\\d+)?$'
      description: Plain positive decimal without exponent notation; accepted request fields must be > 0, at most 8 fractional digits, and at most 1000000. Leading zeros are accepted and normalized by value, so no maxLength is imposed.
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
