spring:
  application:
    name: awakening-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/awakening}
    username: ${DATABASE_USER:awakening}
    password: ${DATABASE_PASSWORD:awakening}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

awakening:
  rpc:
    url: ${AWAKENING_RPC_URL:http://localhost:8545}
    chain-id: ${AWAKENING_CHAIN_ID:31337}
  indexer:
    start-block: ${AWAKENING_INDEXER_START_BLOCK:0}
    confirmations: ${AWAKENING_INDEXER_CONFIRMATIONS:12}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
