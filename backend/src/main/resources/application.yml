spring:
  application:
    name: awakening-backend
  profiles:
    default: mock

awakening:
  rpc:
    url: ${AWAKENING_RPC_URL:}
    chain-id: ${AWAKENING_CHAIN_ID:31337}
  contracts:
    awakening-address: ${AWAKENING_CONTRACT_ADDRESS:}
    settlement-address: ${SETTLEMENT_CONTRACT_ADDRESS:}
    pat-address: ${PAT_CONTRACT_ADDRESS:}
    option-vault-address: ${OPTION_VAULT_CONTRACT_ADDRESS:}
  cors:
    allowed-origins: ${AWAKENING_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  indexer:
    start-block: ${AWAKENING_INDEXER_START_BLOCK:0}
    confirmations: ${AWAKENING_INDEXER_CONFIRMATIONS:12}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: mock
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
