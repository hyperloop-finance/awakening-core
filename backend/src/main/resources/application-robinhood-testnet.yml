server:
  address: 127.0.0.1
  port: ${PORT:8084}
spring:
  datasource:
    url: ${AWAKENING_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/awakening_bsc}
    username: ${AWAKENING_DATABASE_USER:awakening}
    password: ${AWAKENING_DATABASE_PASSWORD}
    hikari:
      schema: awakening_robinhood
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: awakening_robinhood
    schemas: awakening_robinhood
awakening:
  cors:
    allowed-origins: ${AWAKENING_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000}
  rpc:
    url: ${AWAKENING_RPC_URL:https://rpc.testnet.chain.robinhood.com}
    chain-id: 46630
  indexer:
    start-block: ${AWAKENING_INDEXER_START_BLOCK:0}
    confirmations: 12
